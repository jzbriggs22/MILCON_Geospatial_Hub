services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: milcon
      POSTGRES_USER: milcon
      POSTGRES_PASSWORD: milcon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milcon -d milcon"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://milcon:milcon@db:5432/milcon"
    ports:
      - "8501:8501"
    volumes:
      - ./runs:/opt/app/runs
    command: >
      bash -c "
        alembic upgrade head &&
        python -m app.cli seed --rows 2000 --seed 42 &&
        streamlit run app/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
      "

volumes:
  pgdata:
